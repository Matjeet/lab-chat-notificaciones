plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.protobuf' version '0.9.6'
}

group = 'com.arquetipo'
version = '0.0.1-SNAPSHOT'
description = 'Notificaciones para los usuarios del sistema (hoy, solicitudes de chat entrantes), consumidas por RabbitMQ'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	springdocVersion = '3.1.1'
	// Spring Boot 4.1.1 gestiona io.grpc:* como 1.83.1 en su BOM de dependencias: fijar aqui
	// otra version distinta provoca un conflicto de resolucion (Gradle se queda con la mas
	// alta de las dos) y un ABI mismatch entre grpc-stub y grpc-core -> AbstractMethodError
	// en tiempo de ejecucion. Mismo criterio que chat-gateway/chat-conversacion.
	grpcVersion = '1.83.1'
	protobufVersion = '4.29.5'
}

dependencies {
	// --- Web / MVC (Actuator; sin REST propio por ahora) ---
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// --- Persistencia (tabla notificaciones) ---
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testRuntimeOnly 'com.h2database:h2'          // solo para los slices de test (@DataJpaTest, @SpringBootTest)

	// --- Migraciones de esquema (Flyway) ---
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-mysql'

	// --- AMQP (consumo de eventos de RabbitMQ, p. ej. solicitudes de chat nuevas) ---
	implementation 'org.springframework.boot:spring-boot-starter-amqp'

	// --- Observabilidad ---
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// --- Documentacion de API (OpenAPI / Swagger UI) ---
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// --- gRPC (cliente de chat-registro: valida que remitente/receptor existan antes de
	// persistir una notificacion) --- Este servicio no expone gRPC propio, solo consume.
	implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
	implementation "io.grpc:grpc-protobuf:${grpcVersion}"
	implementation "io.grpc:grpc-stub:${grpcVersion}"
	implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
	compileOnly 'jakarta.annotation:jakarta.annotation-api'  // @Generated en los stubs generados

	// --- Utilidades de desarrollo ---
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// --- Test ---
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// Los tests NO leen .env: corren siempre sobre H2 en memoria.
}

// Genera los stubs de gRPC/protobuf a partir de src/main/proto/*.proto (build/generated/source/proto).
protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:${protobufVersion}"
	}
	plugins {
		grpc {
			artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
		}
	}
	generateProtoTasks {
		all().configureEach {
			// El plugin com.google.protobuf (0.9.6) todavia no soporta la configuration
			// cache de Gradle: GenerateProtoTask/ProtobufExtract guardan una referencia a
			// Project/SourceDirectorySet que Gradle no puede serializar, y sin este aviso
			// explicito la build revienta ("Configuration cache entry discarded with N
			// problems") en vez de simplemente no cachear estas tareas. Mismo motivo que
			// chat-gateway. Quitar esto en cuanto el plugin declare soporte para
			// configuration cache.
			notCompatibleWithConfigurationCache(
					"com.google.protobuf gradle plugin no soporta aun la configuration cache")
			plugins {
				grpc {}
			}
		}
	}
}

// Mismo problema que arriba pero para el otro tipo de tarea del plugin (:extractProto,
// :extractIncludeProto, ...), que no pasa por generateProtoTasks.
tasks.withType(com.google.protobuf.gradle.ProtobufExtract).configureEach {
	notCompatibleWithConfigurationCache(
			"com.google.protobuf gradle plugin no soporta aun la configuration cache")
}

// La carga de .env vive DENTRO de la aplicacion (ver
// com.arquetipo.demo.common.env.DotenvEnvironmentPostProcessor), no aqui: asi funciona igual
// arrancando con `./gradlew bootRun`, desde el IDE, o como jar. No hace falta nada especial
// en esta tarea.

// Solo se publica el jar ejecutable de Spring Boot (evita el "-plain.jar").
tasks.named('jar') {
	enabled = false
}
